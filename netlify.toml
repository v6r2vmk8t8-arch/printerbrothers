# Printer Brothers – Netlify-Einstellungen
[build]
  publish = "public"
  command = "echo 'Keine Build-Schritte nötig'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

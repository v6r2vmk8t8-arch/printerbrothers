<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080A0B">
<title>Shop verwalten · Printer Brothers</title>
<style>
:root{
  --void:#080A0B; --plate:#111517; --plate-2:#181D20; --plate-3:#212729;
  --line:rgba(236,241,238,.10); --line-strong:rgba(236,241,238,.19);
  --ink:#ECF1EE; --ink-soft:#93A49A; --data:#B9C8BE;
  --filament:#39FF14; --filament-soft:rgba(57,255,20,.11); --filament-line:rgba(57,255,20,.34);
  --pla:#FF7A2F; --pla-soft:rgba(255,122,47,.11); --pla-line:rgba(255,122,47,.32);
  --danger:#FF5A5A;
  --r-sm:6px; --r-md:12px; --r-lg:18px;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--void);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--filament);outline-offset:2px}
[hidden]{display:none !important}

.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:rgba(8,10,11,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:.9rem}
.brand svg{width:26px;height:26px}
.brand small{color:var(--ink-soft);font-weight:500;text-transform:none;letter-spacing:0}
.bar-actions{display:flex;gap:8px;align-items:center}
@media (max-width:520px){ .brand .full{display:none} }

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-sm);padding:11px 16px;font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;min-height:44px;transition:background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),opacity .2s}
.btn-primary{background:var(--filament);color:var(--void)}
.btn-primary:hover{background:#8DFF6E}
.btn-ghost{background:none;border-color:var(--line-strong);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-soft)}
.btn-danger{background:none;border-color:rgba(255,90,90,.4);color:var(--danger)}
.btn-danger:hover{background:rgba(255,90,90,.08)}
.btn[disabled]{opacity:.5;cursor:default}
.btn-sm{min-height:38px;padding:7px 12px;font-size:.85rem}
.icon-btn{width:40px;height:40px;min-height:40px;padding:0}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:380px;background:var(--plate);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 22px}
.login-card h1{font-size:1.35rem;margin:14px 0 4px}
.login-card p{color:var(--ink-soft);margin:0 0 20px;font-size:.93rem}
.login-card svg.logo{width:44px;height:44px}

label.field{display:grid;gap:6px;margin-bottom:14px}
label.field > span{font-size:.85rem;color:var(--ink-soft);font-weight:500}
input[type=text],input[type=password],input[type=number],textarea{width:100%;background:var(--plate-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;font-size:16px;transition:border-color .2s}
input:focus,textarea:focus{outline:none;border-color:var(--filament-line)}
textarea{resize:vertical;min-height:84px}
.hint{font-size:.8rem;color:var(--ink-soft);margin-top:-8px;margin-bottom:14px}
.error{color:var(--danger);font-size:.88rem;margin:0 0 14px}

/* list */
main{padding:20px 0 120px}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.intro h1{margin:0;font-size:1.5rem}
.intro p{margin:2px 0 0;color:var(--ink-soft);font-size:.9rem}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--plate);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;cursor:pointer;transition:border-color .2s}
.item:hover{border-color:var(--filament-line)}
.chev{color:var(--ink-soft);font-size:1.3rem;padding:0 4px}
.item.hidden-item{opacity:.55}
.thumb{width:64px;height:64px;border-radius:8px;background:var(--plate-2);overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:70%;height:70%}
.meta{min-width:0}
.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .sub{font-size:.85rem;color:var(--ink-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{white-space:nowrap;font-size:.7rem;padding:2px 7px;border-radius:99px;border:1px solid var(--pla-line);color:var(--pla);background:var(--pla-soft)}
.item-actions{display:flex;gap:6px;align-items:center}
.order{display:flex;flex-direction:column;gap:2px}
.order button{width:34px;height:26px;min-height:26px;padding:0;font-size:.8rem}
.empty{padding:40px 16px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line-strong);border-radius:var(--r-md)}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 12px 30px -10px rgba(57,255,20,.55);padding:14px 22px}

/* editor sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(3,5,6,.7);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--plate);border-top:1px solid var(--line-strong);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s var(--ease)}
.sheet.open{transform:none}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;border-radius:var(--r-lg);border:1px solid var(--line-strong);transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:transform .35s var(--ease),opacity .25s}
  .sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h2{margin:0;font-size:1.15rem}
.photo-pick{position:relative;display:grid;place-items:center;aspect-ratio:4/3;border-radius:var(--r-md);border:1px dashed var(--line-strong);background:var(--plate-2);overflow:hidden;cursor:pointer;margin-bottom:8px}
.photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-pick .ph{text-align:center;color:var(--ink-soft);font-size:.92rem;padding:16px}
.photo-pick .ph svg{width:34px;height:34px;display:block;margin:0 auto 8px;color:var(--filament)}
.photo-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-row{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:16px;min-height:38px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.switch{display:flex;align-items:center;gap:10px;margin:4px 0 18px;cursor:pointer;user-select:none}
.switch input{width:22px;height:22px;accent-color:var(--filament)}
.sheet-foot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sheet-foot .right{display:flex;gap:10px;margin-left:auto}

.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--plate-3);border:1px solid var(--line-strong);padding:10px 16px;border-radius:99px;font-size:.9rem;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:var(--filament-line);color:var(--filament)}
.toast.err{border-color:rgba(255,90,90,.5);color:var(--danger)}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <defs>
    <symbol id="pb-mark" viewBox="-8 -8 116 116">
      <polygon points="10,50 30,16 70,16 90,50 70,84 30,84" fill="#39FF14"/>
      <line x1="70" y1="16" x2="86" y2="2" stroke="#39FF14" stroke-width="3" stroke-linecap="round"/>
      <circle cx="86" cy="2" r="4" fill="#39FF14"/>
      <line x1="30" y1="84" x2="14" y2="98" stroke="#39FF14" stroke-width="3" stroke-linecap="round"/>
      <circle cx="14" cy="98" r="4" fill="#39FF14"/>
      <rect x="42" y="23" width="16" height="9" rx="2" fill="#080A0B"/>
      <polygon points="45,32 55,32 50,40" fill="#080A0B"/>
      <text x="50" y="70" text-anchor="middle" font-family="ui-monospace,monospace" font-weight="700" font-size="26" fill="#080A0B">PB</text>
      <rect x="27" y="76" width="46" height="4" rx="2" fill="#080A0B"/>
    </symbol>
  </defs>
</svg>

<!-- ============ LOGIN ============ -->
<section class="login" id="loginView">
  <form class="login-card" id="loginForm">
    <svg class="logo" viewBox="-8 -8 116 116" aria-hidden="true"><use href="#pb-mark"/></svg>
    <h1>Shop verwalten</h1>
    <p>Nur für Nathanael &amp; Marlon. Bitte Passwort eingeben.</p>
    <label class="field">
      <span>Passwort</span>
      <input type="password" id="pw" autocomplete="current-password" required>
    </label>
    <p class="error" id="loginError" hidden></p>
    <button class="btn btn-primary" style="width:100%" type="submit" id="loginBtn">Einloggen</button>
  </form>
</section>

<!-- ============ VERWALTUNG ============ -->
<div id="appView" hidden>
  <header>
    <div class="wrap bar">
      <div class="brand">
        <svg viewBox="-8 -8 116 116" aria-hidden="true"><use href="#pb-mark"/></svg>
        <span><span class="full">Printer Brothers </span><small>Admin</small></span>
      </div>
      <div class="bar-actions">
        <a class="btn btn-ghost btn-sm" href="/#shop" target="_blank" rel="noopener">Shop ↗</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">Abmelden</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="intro">
      <div>
        <h1>Produkte</h1>
        <p id="countInfo">Lädt …</p>
      </div>
    </div>
    <div class="list" id="list"></div>
  </main>

  <button class="btn btn-primary fab" id="addBtn" type="button">+ Neues Produkt</button>
</div>

<!-- ============ EDITOR ============ -->
<div class="sheet-bg" id="sheetBg"></div>
<form class="sheet" id="sheet" aria-hidden="true" novalidate>
  <div class="sheet-head">
    <h2 id="sheetTitle">Neues Produkt</h2>
    <button class="btn btn-ghost icon-btn" type="button" id="sheetClose" aria-label="Schließen">✕</button>
  </div>

  <label class="photo-pick" id="photoPick">
    <img id="photoPreview" alt="" hidden>
    <div class="ph" id="photoPh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Foto aufnehmen oder auswählen
    </div>
    <input type="file" id="photoInput" accept="image/*">
  </label>
  <div class="photo-row">
    <span class="hint" style="margin:0" id="photoHint">Wird automatisch verkleinert.</span>
    <button class="btn btn-ghost btn-sm" type="button" id="photoRemove" hidden>Foto entfernen</button>
  </div>

  <label class="field">
    <span>Name</span>
    <input type="text" id="fName" maxlength="60" required placeholder="z. B. Mini-Drache">
  </label>
  <label class="field">
    <span>Beschreibung</span>
    <textarea id="fDesc" maxlength="240" placeholder="Ein, zwei Sätze zum Teil"></textarea>
  </label>
  <div class="row2">
    <label class="field">
      <span>Preis in €</span>
      <input type="text" id="fPrice" inputmode="decimal" placeholder="12,50" required>
    </label>
  </div>
  <label class="switch"><input type="checkbox" id="fVisible" checked> Im Shop sichtbar</label>

  <p class="error" id="sheetError" hidden></p>
  <div class="sheet-foot">
    <button class="btn btn-danger" type="button" id="deleteBtn" hidden>Löschen</button>
    <div class="right">
      <button class="btn btn-ghost" type="button" id="cancelBtn">Abbrechen</button>
      <button class="btn btn-primary" type="submit" id="saveBtn">Speichern</button>
    </div>
  </div>
</form>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  var ICONS = ['drache','vase','schach','stand','flitzer'];
  var pw = '';
  var products = [];
  var editIndex = -1;       // -1 = neues Produkt
  var pendingPhoto = null;  // verkleinertes Foto (Blob), noch nicht hochgeladen
  var photoState = null;    // aktuelle Bild-URL im Formular (oder null)
  var busy = false;

  var $ = function(id){ return document.getElementById(id); };

  /* ---------- Hilfen ---------- */
  function store(k, v){ try{ v === undefined ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); }catch(e){} }
  function load(k){ try{ return sessionStorage.getItem(k) || ''; }catch(e){ return ''; } }
  function euro(n){ return Number(n).toLocaleString('de-AT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
  function parsePrice(s){
    s = String(s).trim().replace(/\s|€/g,'');
    if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,'');
    s = s.replace(',', '.');
    var n = Number(s);
    return /^\d+(\.\d{1,2})?$/.test(s) && n <= 10000 ? n : NaN;
  }
  var toastTimer;
  function toast(msg, kind){
    var t = $('toast');
    t.textContent = msg; t.className = 'toast show ' + (kind || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className = 'toast'; }, kind === 'err' ? 4200 : 2000);
  }

  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ 'x-admin-password': pw }, opts.headers || {});
    return fetch('/api/admin/' + path, opts).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(body){
        if(r.status === 401){ logout(); throw new Error(body.error || 'Bitte neu einloggen.'); }
        if(!r.ok) throw new Error(body.error || ('Fehler ' + r.status));
        return body;
      });
    }, function(){ throw new Error('Keine Verbindung zum Server.'); });
  }

  /* ---------- Login ---------- */
  function showApp(){ $('loginView').hidden = true; $('appView').hidden = false; refresh(); }
  function logout(){
    pw = ''; store('pbpw');
    $('appView').hidden = true; $('loginView').hidden = false;
    closeSheet(true);
    $('pw').value = ''; $('pw').focus();
  }
  $('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var btn = $('loginBtn'), err = $('loginError');
    pw = $('pw').value;
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Prüfe …'; err.hidden = true;
    api('login', { method:'POST' }).then(function(){
      store('pbpw', pw); showApp();
    }).catch(function(ex){
      err.textContent = ex.message; err.hidden = false; pw = '';
    }).then(function(){ btn.disabled = false; btn.textContent = 'Einloggen'; });
  });
  $('logoutBtn').addEventListener('click', logout);

  /* ---------- Liste ---------- */
  function refresh(){
    api('products').then(function(list){ products = list; renderList(); })
      .catch(function(ex){ $('countInfo').textContent = ex.message; });
  }

  function thumbHTML(p){
    if(p.image) return '<img src="' + encodeURI(p.image) + '" alt="">';
    return '<svg viewBox="-8 -8 116 116" aria-hidden="true" style="opacity:.35"><use href="#pb-mark"/></svg>';
  }

  function renderList(){
    var list = $('list');
    list.innerHTML = '';
    var visible = products.filter(function(p){ return p.visible !== false; }).length;
    $('countInfo').textContent = products.length + ' Produkte · ' + visible + ' sichtbar im Shop';
    if(!products.length){
      list.innerHTML = '<div class="empty">Noch keine Produkte. Tippe unten auf „+ Neues Produkt“.</div>';
      return;
    }
    products.forEach(function(p, i){
      var el = document.createElement('div');
      el.className = 'item' + (p.visible === false ? ' hidden-item' : '');
      el.innerHTML =
        '<div class="thumb">' + thumbHTML(p) + '</div>' +
        '<div class="meta"><b></b><div class="sub"><span class="mono"></span>' +
          (p.visible === false ? '<span class="tag">ausgeblendet</span>' : '') +
          (!p.image && p.icon ? '<span class="tag" style="color:var(--data);border-color:var(--line-strong);background:none">noch kein Foto</span>' : '') +
        '</div></div>' +
        '<div class="item-actions">' +
          '<div class="order">' +
            '<button class="btn btn-ghost" type="button" data-act="up" aria-label="Nach oben"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
            '<button class="btn btn-ghost" type="button" data-act="down" aria-label="Nach unten"' + (i === products.length - 1 ? ' disabled' : '') + '>▼</button>' +
          '</div>' +
          '<span class="chev" aria-hidden="true">›</span>' +
        '</div>';
      el.querySelector('.meta b').textContent = p.name;
      el.querySelector('.meta .mono').textContent = euro(p.price);
      el.querySelectorAll('button[data-act]').forEach(function(b){ b.dataset.i = i; });
      el.dataset.i = i;
      el.setAttribute('role','button'); el.tabIndex = 0;
      el.setAttribute('aria-label', p.name + ' bearbeiten');
      list.appendChild(el);
    });
  }

  $('list').addEventListener('keydown', function(e){
    if((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('item')){ e.preventDefault(); openSheet(Number(e.target.dataset.i)); }
  });
  $('list').addEventListener('click', function(e){
    if(busy) return;
    var b = e.target.closest('button[data-act]');
    if(!b){ var row = e.target.closest('.item'); if(row) openSheet(Number(row.dataset.i)); return; }
    var i = Number(b.dataset.i), act = b.dataset.act;
    if(act === 'edit') return openSheet(i);
    var j = act === 'up' ? i - 1 : i + 1;
    if(j < 0 || j >= products.length) return;
    var next = products.slice();
    var tmp = next[i]; next[i] = next[j]; next[j] = tmp;
    save(next, 'Reihenfolge gespeichert');
  });

  function save(next, msg){
    busy = true;
    return api('products', {
      method:'PUT', headers:{ 'content-type':'application/json' }, body: JSON.stringify(next)
    }).then(function(res){
      products = res.products; renderList(); toast(msg || 'Gespeichert ✓', 'ok');
    }).catch(function(ex){ toast(ex.message, 'err'); throw ex; })
      .then(function(v){ busy = false; return v; }, function(ex){ busy = false; throw ex; });
  }

  /* ---------- Editor ---------- */
  function setPhoto(url){
    photoState = url;
    var img = $('photoPreview');
    if(url){ img.src = url; img.hidden = false; $('photoPh').hidden = true; $('photoRemove').hidden = false; }
    else { img.removeAttribute('src'); img.hidden = true; $('photoPh').hidden = false; $('photoRemove').hidden = true; }
  }

  function openSheet(i){
    editIndex = i;
    var p = i >= 0 ? products[i] : { name:'', desc:'', price:'', visible:true, image:null };
    $('sheetTitle').textContent = i >= 0 ? 'Produkt bearbeiten' : 'Neues Produkt';
    $('fName').value = p.name || '';
    $('fDesc').value = p.desc || '';
    $('fPrice').value = p.price === '' ? '' : String(p.price).replace('.', ',');
    $('fVisible').checked = p.visible !== false;
    $('deleteBtn').hidden = i < 0;
    $('sheetError').hidden = true;
    $('photoInput').value = '';
    pendingPhoto = null;
    setPhoto(p.image || null);
    $('photoHint').textContent = 'Wird automatisch verkleinert.';
    $('sheetBg').classList.add('open');
    $('sheet').classList.add('open');
    $('sheet').setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
    if(i < 0) setTimeout(function(){ $('fName').focus(); }, 350);
  }
  function closeSheet(force){
    if(busy && !force) return;
    $('sheetBg').classList.remove('open');
    $('sheet').classList.remove('open');
    $('sheet').setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
    if(pendingPhoto && photoState && photoState.indexOf('blob:') === 0) URL.revokeObjectURL(photoState);
    pendingPhoto = null;
  }
  $('addBtn').addEventListener('click', function(){ openSheet(-1); });
  $('sheetClose').addEventListener('click', function(){ closeSheet(); });
  $('cancelBtn').addEventListener('click', function(){ closeSheet(); });
  $('sheetBg').addEventListener('click', function(){ closeSheet(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSheet(); });

  /* Foto verkleinern: längste Seite max. 1600 px, JPEG */
  function shrink(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight;
        var k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#111517'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){ b ? resolve(b) : reject(new Error('Foto konnte nicht verarbeitet werden.')); }, 'image/jpeg', 0.85);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('Dieses Bildformat wird nicht unterstützt.')); };
      img.src = url;
    });
  }

  $('photoInput').addEventListener('change', function(){
    var f = this.files && this.files[0];
    if(!f) return;
    $('photoHint').textContent = 'Verkleinere Foto …';
    shrink(f).then(function(blob){
      pendingPhoto = blob;
      setPhoto(URL.createObjectURL(blob));
      $('photoHint').textContent = 'Neues Foto (' + Math.round(blob.size / 1024) + ' KB) – wird beim Speichern hochgeladen.';
    }).catch(function(ex){
      $('photoHint').textContent = ex.message;
    });
  });
  $('photoRemove').addEventListener('click', function(){
    pendingPhoto = null; $('photoInput').value = ''; setPhoto(null);
    $('photoHint').textContent = 'Ohne Foto wird das Logo als Platzhalter gezeigt.';
  });

  $('sheet').addEventListener('submit', function(e){
    e.preventDefault();
    if(busy) return;
    var err = $('sheetError');
    var name = $('fName').value.trim();
    var price = parsePrice($('fPrice').value);
    err.hidden = true;
    if(!name){ err.textContent = 'Bitte einen Namen eingeben.'; err.hidden = false; $('fName').focus(); return; }
    if(isNaN(price)){ err.textContent = 'Bitte einen gültigen Preis eingeben, z. B. 12,50'; err.hidden = false; $('fPrice').focus(); return; }

    var btn = $('saveBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Speichere …';
    busy = true;

    var upload = pendingPhoto
      ? api('upload', { method:'POST', headers:{ 'content-type':'image/jpeg' }, body: pendingPhoto }).then(function(r){ return r.url; })
      : Promise.resolve(photoState && photoState.indexOf('blob:') !== 0 ? photoState : null);

    upload.then(function(imageUrl){
      var old = editIndex >= 0 ? products[editIndex] : {};
      var item = {
        id: old.id, name: name, desc: $('fDesc').value.trim(), price: price,
        image: imageUrl, icon: imageUrl ? null : (ICONS.indexOf(old.icon) >= 0 ? old.icon : null),
        visible: $('fVisible').checked
      };
      var next = products.slice();
      if(editIndex >= 0) next[editIndex] = item; else next.unshift(item);
      busy = false;
      return save(next, editIndex >= 0 ? 'Änderungen gespeichert ✓' : 'Produkt hinzugefügt ✓');
    }).then(function(){
      closeSheet(true);
    }).catch(function(ex){
      busy = false;
      err.textContent = ex.message; err.hidden = false;
    }).then(function(){ btn.disabled = false; btn.textContent = 'Speichern'; });
  });

  $('deleteBtn').addEventListener('click', function(){
    if(editIndex < 0 || busy) return;
    var p = products[editIndex];
    if(!confirm('„' + p.name + '“ wirklich löschen?')) return;
    var next = products.slice(); next.splice(editIndex, 1);
    save(next, 'Gelöscht').then(function(){ closeSheet(true); }).catch(function(){});
  });

  /* ---------- Start ---------- */
  pw = load('pbpw');
  if(pw){
    api('login', { method:'POST' }).then(showApp).catch(function(){ pw = ''; store('pbpw'); });
  }
})();
</script>
</body>
</html>
